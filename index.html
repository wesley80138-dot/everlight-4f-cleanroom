<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>億光大樓 4F 無塵室機台配置</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f4f3ee; --paper-2:#e9e7e0; --ink:#1c1e21; --ink-2:#55585e; --ink-3:#8a8d93; --rule:#cfcdc4;
  --stage:#2a2e34; --accent:#d8262e; --ok:#1e8c7a;
  --c-litho:#6a4fb6; --c-metro:#2e6db4; --c-wet:#1e8c7a; --c-film:#d3711b; --c-custom:#7a7d83;
  --zone:#1aa3c7;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#1f2227; --paper-2:#272b31; --ink:#e7e6e1; --ink-2:#b4b3ad; --ink-3:#7d7f85; --rule:#3a3e45; --stage:#131519;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#1f2227; --paper-2:#272b31; --ink:#e7e6e1; --ink-2:#b4b3ad; --ink-3:#7d7f85; --rule:#3a3e45; --stage:#131519;
}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0; height:100%; display:flex; flex-direction:column; overflow:hidden; background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans","Noto Sans TC",system-ui,-apple-system,"Segoe UI",sans-serif; font-size:13px; line-height:1.45;
  font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit; color:inherit}
button{background:var(--paper-2); border:1px solid var(--rule); border-radius:4px; padding:4px 9px; cursor:pointer; white-space:nowrap}
button:hover{border-color:var(--ink-3)}
button.on{background:var(--ink); color:var(--paper); border-color:var(--ink)}
button.danger{color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
input[type=text],input[type=number],select,textarea{background:var(--paper); border:1px solid var(--rule); border-radius:4px; padding:3px 6px}
input[type=number]{width:72px}
label.chk{display:inline-flex; align-items:center; gap:4px; cursor:pointer}

header.bar{display:flex; align-items:center; gap:6px; padding:6px 10px; border-bottom:1px solid var(--rule); flex-wrap:wrap}
header.bar h1{font-size:14px; font-weight:600; margin:0 10px 0 0; font-family:"Noto Sans TC","IBM Plex Sans",sans-serif}
header .sep{width:1px; height:20px; background:var(--rule); margin:0 4px}
header .grow{flex:1}
header .hint{color:var(--ink-3); font-size:12px}

main{flex:1; display:grid; grid-template-columns:300px 1fr; min-height:0}
aside{border-right:1px solid var(--rule); overflow:auto; min-height:0; display:flex; flex-direction:column}
aside section{padding:8px 10px; border-bottom:1px solid var(--rule)}
aside h2{font-size:12px; font-weight:600; color:var(--ink-2); margin:0 0 6px; display:flex; justify-content:space-between; align-items:center;
  font-family:"Noto Sans TC","IBM Plex Sans",sans-serif}
#search{width:100%; margin-bottom:6px}
.cat{margin:6px 0 2px; font-size:12px; color:var(--ink-2); display:flex; align-items:center; gap:6px}
.chip{display:inline-block; width:10px; height:10px; border-radius:2px}
.pal{display:flex; align-items:center; gap:6px; padding:3px 0; border-top:1px dashed var(--rule)}
.pal .nm{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.pal .dim{color:var(--ink-3); font-size:11px; width:78px; text-align:right}
.pal .cnt{color:var(--ink-3); font-size:11px; width:32px; text-align:right}
.pal .cnt.full{color:var(--ok)}
.pal button{padding:1px 7px}
.placed{display:flex; gap:6px; padding:2px 0; cursor:pointer; border-top:1px dashed var(--rule); align-items:center}
.placed:hover{background:var(--paper-2)}
.placed.sel{background:var(--paper-2); font-weight:600}
.placed .no{width:22px; color:var(--ink-3); font-size:11px}
.placed .nm{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.placed .pos{color:var(--ink-3); font-size:11px}
.placed button.x{padding:0 7px; line-height:1.4; color:var(--accent); border-color:transparent; background:transparent; font-size:14px}
.placed button.x:hover{border-color:var(--accent)}
.kv{display:grid; grid-template-columns:auto 1fr; gap:3px 8px; align-items:center}
.kv .k{color:var(--ink-2)}
.row{display:flex; gap:6px; flex-wrap:wrap; margin-top:6px}
.fac{margin-top:8px; border-top:1px solid var(--rule); padding-top:6px; font-size:12px}
.fac div{display:flex; justify-content:space-between; gap:8px; padding:1px 0}
.fac div span:first-child{color:var(--ink-2)}
.empty{color:var(--ink-3); font-size:12px}
.custom{display:grid; grid-template-columns:1fr 1fr auto; gap:4px; align-items:center}
.custom input[type=text]{grid-column:1/-1}
.custom input[type=number]{width:100%}

#stage{position:relative; background:var(--stage); min-height:0; overflow:hidden}
#svg{width:100%; height:100%; display:block; touch-action:none; cursor:grab; user-select:none}
#svg.tool-select{cursor:default}
#svg.tool-zone,#svg.tool-measure,#svg.tool-calib{cursor:crosshair}
#svg.panning{cursor:grabbing}
#hud{position:absolute; left:10px; bottom:8px; color:#ddd; font-size:11px; pointer-events:none; display:flex; gap:14px; align-items:flex-end}
#scalebar{height:14px; display:flex; flex-direction:column; justify-content:flex-end}
#scalebar .bar{height:4px; background:#ddd; border:1px solid #333}
#toast{position:absolute; top:10px; left:50%; transform:translateX(-50%); background:rgba(20,22,26,.9); color:#eee; padding:6px 12px; border-radius:4px;
  font-size:12px; opacity:0; transition:opacity .2s; pointer-events:none; max-width:80%}
#toast.show{opacity:1}

footer{border-top:1px solid var(--rule); padding:5px 10px; display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--ink-2)}
footer b{color:var(--ink); font-weight:600}
footer .warn{color:var(--accent)}

dialog{border:1px solid var(--rule); border-radius:6px; background:var(--paper); color:var(--ink); padding:14px; width:min(720px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog textarea{width:100%; height:300px; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12px; white-space:pre}
dialog .tabs{display:flex; gap:6px; margin-bottom:8px}

@media (max-width:820px){
  main{grid-template-columns:1fr; grid-template-rows:1fr 42vh}
  aside{border-right:0; border-top:1px solid var(--rule); order:2}
  #stage{order:1}
}
@media (prefers-reduced-motion: reduce){ #toast{transition:none} }
</style>
</head>
<body>
<header class="bar">
  <h1>億光大樓 4F 無塵室機台配置</h1>
  <button id="t-select" class="on" title="S">選取 / 移動</button>
  <button id="t-zone" title="Z">畫區域</button>
  <button id="t-measure" title="M">量距離</button>
  <button id="t-calib" title="兩點校正圖面比例">校正比例</button>
  <span class="sep"></span>
  <label class="chk"><input type="checkbox" id="snap" checked> 吸附</label>
  <select id="grid" title="吸附格點"><option value="5">5 cm</option><option value="10" selected>10 cm</option><option value="50">50 cm</option><option value="100">1 m</option></select>
  <label class="chk"><input type="checkbox" id="showGrid"> 格線 1 m</label>
  <label class="chk"><input type="checkbox" id="showClear" checked> 維修間距</label>
  <label class="chk"><input type="checkbox" id="showLabels" checked> 標籤</label>
  <span class="sep"></span>
  <button id="zoomOut">−</button><button id="zoomIn">＋</button><button id="fit" title="0">全圖</button>
  <span class="grow"></span>
  <button id="export">匯出 / 載入</button>
  <button id="reset" class="danger">清空</button>
  <span class="hint" id="hint">拖曳機台移動 · R 旋轉 90° · Delete 刪除 · Ctrl+D 複製 · 滾輪縮放 · 拖曳空白處平移 · 粗邊＝操作面</span>
</header>
<main>
  <aside>
    <section>
      <h2>機台清單 <span id="palCount"></span></h2>
      <input type="text" id="search" placeholder="搜尋機台…">
      <div id="palette"></div>
      <div class="cat" style="margin-top:10px"><span class="chip" style="background:var(--c-custom)"></span>自訂物件（桌、櫃、通道…）</div>
      <div class="custom">
        <input type="text" id="cName" placeholder="名稱">
        <input type="number" id="cW" placeholder="W mm" min="10">
        <input type="number" id="cD" placeholder="D mm" min="10">
        <button id="cAdd">放入</button>
      </div>
    </section>
    <section>
      <h2>已放置 <span id="placedCount"></span></h2>
      <div id="placedList"><div class="empty">尚未放置任何機台。點清單中的「放入」。</div></div>
    </section>
    <section id="details">
      <h2>選取物件</h2>
      <div class="empty">點選圖上的機台或區域。</div>
    </section>
  </aside>
  <section id="stage">
    <svg id="svg" class="tool-select" xmlns="http://www.w3.org/2000/svg"><image id="planImg" preserveAspectRatio="none"/><g id="dyn"></g></svg>
    <div id="hud"><div id="scalebar"><div id="sbLabel">1 m</div><div class="bar" style="width:40px"></div></div><div id="cursorPos"></div></div>
    <div id="toast"></div>
  </section>
</main>
<footer id="status"></footer>

<dialog id="dlg">
  <div class="tabs"><button id="tabText" class="on">配置清單（文字）</button><button id="tabJson">JSON（存檔 / 載入）</button><span class="grow" style="flex:1"></span><button id="dlgClose">關閉</button></div>
  <textarea id="dlgText" spellcheck="false"></textarea>
  <div class="row"><button id="copyBtn">複製</button><button id="loadBtn" hidden>載入此 JSON</button><span class="hint" id="dlgHint"></span></div>
</dialog>
<dialog id="askDlg" style="width:min(420px,92vw)"><div id="askMsg" style="margin-bottom:8px"></div><input type="text" id="askVal" style="width:100%"><div class="row"><button id="askOk" class="on">確定</button><button id="askCancel">取消</button></div></dialog>

/* ---------- geometry ---------- */
const toWorld = (sx,sy) => [(sx-S.tx)/S.s, (sy-S.ty)/S.s];
const toScreen = (wx,wy) => [wx*S.s+S.tx, wy*S.s+S.ty];
function corners(it, pad=0){ const w=it.w/10/2+pad, d=it.d/10/2+pad, a=it.a*Math.PI/180, c=Math.cos(a), s=Math.sin(a);

function snapv(v){ if(!$('snap').checked) return v; const g=+$('grid').value; return Math.round(v/g)*g; }
function planCm(){ return [PLAN.w*S.cmPerPx, PLAN.h*S.cmPerPx]; }

/* ---------- items ---------- */
function addItem(def, atCenter=true){
  const r = svg.getBoundingClientRect(); let [x,y] = toWorld(r.width/2, r.height/2);
  const n = S.items.length % 10; x += n*45 - 200; y += n*35 - 150;
  const it = { id:S.nextId++, key:def.key, name:def.short||def.name, full:def.name, cat:def.cat||'custom', w:def.w, d:def.d, h:def.h||0,
    x:snapv(x), y:snapv(y), a:0, clr:def.cat==='custom'?0:60 };
  S.items.push(it); S.sel={t:'item',id:it.id}; render(); return it; }
function removeSel(){ if(!S.sel) return; if(S.sel.t==='item') S.items=S.items.filter(i=>i.id!==S.sel.id); else S.zones=S.zones.filter(z=>z.id!==S.sel.id); S.sel=null; render(); }

function selItem(){ return S.sel&&S.sel.t==='item' ? S.items.find(i=>i.id===S.sel.id) : null; }
function selZone(){ return S.sel&&S.sel.t==='zone' ? S.zones.find(z=>z.id===S.sel.id) : null; }

    o+=`<line x1="${-w/2}" y1="${d/2}" x2="${w/2}" y2="${d/2}" stroke="#111" stroke-opacity=".8" stroke-width="${Math.max(2,Math.min(6,s*8))}"/>`; // operation side
    if(sel){ o+=`<line x1="0" y1="${-d/2}" x2="0" y2="${-d/2-26}" stroke="#111" stroke-width="1"/><circle data-rot="${it.id}" cx="0" cy="${-d/2-30}" r="6" fill="#fff" stroke="#111" stroke-width="1.5" style="cursor:grab"/>`; }
    o+='</g>';

    if(showL){ const sc=corners(it).map(([x,y])=>toScreen(x,y)); const bx=Math.min(...sc.map(p=>p[0])), by=Math.min(...sc.map(p=>p[1]));
      const big = Math.min(w,d)>34;
      if(big) o+=`<text x="${cx}" y="${cy-1}" text-anchor="middle" font-size="11" font-weight="600" fill="#111" style="pointer-events:none">${esc(it.name)}</text><text x="${cx}" y="${cy+11}" text-anchor="middle" font-size="10" fill="#222" style="pointer-events:none">${it.w}×${it.d}</text>`;

  if(S.measure&&!S.pts.length){ const q=S.measure.map(([x,y])=>toScreen(x,y)); const dcm=Math.hypot(S.measure[1][0]-S.measure[0][0],S.measure[1][1]-S.measure[0][1]);
    o+=`<g style="pointer-events:none"><line x1="${q[0][0]}" y1="${q[0][1]}" x2="${q[1][0]}" y2="${q[1][1]}" stroke="#d8262e" stroke-width="2"/><text x="${(q[0][0]+q[1][0])/2}" y="${(q[0][1]+q[1][1])/2-8}" text-anchor="middle" font-size="12" font-weight="600" fill="#d8262e" stroke="#fff" stroke-width="3" paint-order="stroke">${fmt(dcm,0)} cm (${fmt(dcm/100,2)} m)</text></g>`; }
  if(S.draw){ const [x,y]=toScreen(Math.min(S.draw.x0,S.draw.x1),Math.min(S.draw.y0,S.draw.y1)); o+=`<rect x="${x}" y="${y}" width="${Math.abs(S.draw.x1-S.draw.x0)*s}" height="${Math.abs(S.draw.y1-S.draw.y0)*s}" fill="#1aa3c7" fill-opacity=".15" stroke="#1aa3c7" stroke-dasharray="6 4" style="pointer-events:none"/>`; }
  $('dyn').innerHTML = o;

}
function renderScale(){ const cands=[10,20,50,100,200,500,1000,2000]; let cm=cands.find(c=>c*S.s>=60)||2000; const px=cm*S.s; $('sbLabel').textContent = cm>=100 ? (cm/100)+' m' : cm+' cm'; $('scalebar').querySelector('.bar').style.width=px+'px'; }

      <span class="k">面積</span><span>${fmt(z.w*z.h/1e4,2)} m²</span></div><div class="row"><button id="bDelZ" class="danger">刪除區域</button></div>`;
    const inside=S.items.filter(i=>i.x>=z.x&&i.x<=z.x+z.w&&i.y>=z.y&&i.y<=z.y+z.h); const fp=inside.reduce((a,i)=>a+i.w*i.d/1e6,0);
    d+=`<div class="fac"><div><span>區內機台</span><span>${inside.length} 台</span></div><div><span>機台佔地</span><span>${fmt(fp,2)} m² (${fmt(100*fp/(z.w*z.h/1e4),0)}%)</span></div><div><span>區內 ΣkVA</span><span>${fmt(sumF(inside,'kva'),1)}</span></div></div>`;
  } else d+='<div class="empty">點選圖上的機台或區域。</div>';
  $('details').innerHTML=d;
}
function sumF(list,k){ return list.reduce((a,i)=>{const src=EQUIP.find(e=>e.key===i.key); return a+(src?num(src[k]):0);},0); }
function renderStatus(hit){ const L=S.items; const fp=L.reduce((a,i)=>a+i.w*i.d/1e6,0); const za=S.zones.reduce((a,z)=>a+z.w*z.h/1e4,0);
  const parts=[`已放置 <b>${L.filter(i=>i.cat!=='custom').length}</b> / ${EQUIP.reduce((a,e)=>a+e.qty,0)} 台`, `機台佔地 <b>${fmt(fp,2)} m²</b>`, `區域 <b>${fmt(za,1)} m²</b>`,
    `Σ <b>${fmt(sumF(L,'kva'),1)} kVA</b>`, `CDA <b>${fmt(sumF(L,'cda'),0)} CFM</b>`, `N2 <b>${fmt(sumF(L,'n2'),0)} LPM</b>`, `DIW <b>${fmt(sumF(L,'diw'),0)} LPM</b>`, `PCW <b>${fmt(sumF(L,'pcw'),0)} LPM</b>`,
    `排氣 一般 <b>${fmt(sumF(L,'exGen'),0)}</b> / 熱 <b>${fmt(sumF(L,'exHot'),0)}</b> / 有機 <b>${fmt(sumF(L,'exSolv'),0)}</b> / 酸鹼 <b>${fmt(sumF(L,'exAcid'),0)}</b> / PFC <b>${fmt(sumF(L,'exPfc'),0)}</b> CMM`,
    `重量 <b>${fmt(sumF(L,'kg'),0)} kg</b>`];
  if(hit.size) parts.push(`<span class="warn">重疊 ${hit.size} 台</span>`);
  parts.push(`比例 ${fmt(S.cmPerPx,3)} cm/px`);
  $('status').innerHTML=parts.map(p=>`<span>${p}</span>`).join(''); }

/* ---------- view ---------- */
function fit(){ const r=svg.getBoundingClientRect(); const [pw,ph]=planCm(); S.s=Math.min((r.width-20)/pw,(r.height-20)/ph); S.tx=(r.width-pw*S.s)/2; S.ty=(r.height-ph*S.s)/2; render(); }
function zoomAt(f,px,py){ S.s*=f; S.tx=px-(px-S.tx)*f; S.ty=py-(py-S.ty)*f; render(); }
svg.addEventListener('wheel',e=>{ e.preventDefault(); const r=svg.getBoundingClientRect(); zoomAt(e.deltaY<0?1.15:1/1.15,e.clientX-r.left,e.clientY-r.top); },{passive:false});
$('zoomIn').onclick=()=>{const r=svg.getBoundingClientRect(); zoomAt(1.25,r.width/2,r.height/2);}; $('zoomOut').onclick=()=>{const r=svg.getBoundingClientRect(); zoomAt(0.8,r.width/2,r.height/2);}; $('fit').onclick=fit;

/* ---------- pointer interaction ---------- */
let drag=null; const ptrs=new Map();
svg.addEventListener('pointerdown',e=>{ const r=svg.getBoundingClientRect(); const sx=e.clientX-r.left, sy=e.clientY-r.top; ptrs.set(e.pointerId,[sx,sy]);
  if(ptrs.size===2){ drag={t:'pinch',d0:pinchDist(),s0:S.s,c0:pinchCenter(),tx0:S.tx,ty0:S.ty}; return; }
  svg.setPointerCapture(e.pointerId); const [wx,wy]=toWorld(sx,sy);
  const rot=e.target.closest('[data-rot]'); const g=e.target.closest('[data-id]'); const zg=e.target.closest('[data-zone]');
  if(S.tool==='select'){
    if(rot){ const it=S.items.find(i=>i.id==rot.dataset.rot); drag={t:'rot',it}; return; }
    if(g){ const it=S.items.find(i=>i.id==g.dataset.id); S.sel={t:'item',id:it.id}; drag={t:'move',it,ox:wx-it.x,oy:wy-it.y,moved:false}; render(); return; }
    if(zg){ const z=S.zones.find(i=>i.id==zg.dataset.zone); S.sel={t:'zone',id:z.id}; drag={t:'movez',z,ox:wx-z.x,oy:wy-z.y}; render(); return; }
    drag={t:'pan',sx,sy,tx:S.tx,ty:S.ty,moved:false}; svg.classList.add('panning'); return; }
  if(S.tool==='zone'){ drag={t:'draw'}; S.draw={x0:snapv(wx),y0:snapv(wy),x1:snapv(wx),y1:snapv(wy)}; render(); return; }
  if(S.tool==='measure'||S.tool==='calib'){ S.measure=null; S.pts.push([wx,wy]); if(S.pts.length===2){ finishPts(); } render(); return; }
});
svg.addEventListener('pointermove',e=>{ const r=svg.getBoundingClientRect(); const sx=e.clientX-r.left, sy=e.clientY-r.top; if(ptrs.has(e.pointerId)) ptrs.set(e.pointerId,[sx,sy]);
  const [wx,wy]=toWorld(sx,sy); $('cursorPos').textContent=`${fmt(wx/100,2)}, ${fmt(wy/100,2)} m`;
  if(!drag){ if(S.pts.length===1){ S.measure=[S.pts[0],[wx,wy]]; render(); } return; }
  if(drag.t==='pinch'){ if(ptrs.size<2) return; const f=pinchDist()/drag.d0; const c=pinchCenter(); S.s=drag.s0*f; S.tx=c[0]-(drag.c0[0]-drag.tx0)*f; S.ty=c[1]-(drag.c0[1]-drag.ty0)*f; render(); return; }
  if(drag.t==='pan'){ if(Math.hypot(sx-drag.sx,sy-drag.sy)>3) drag.moved=true; S.tx=drag.tx+sx-drag.sx; S.ty=drag.ty+sy-drag.sy; render(); return; }
  if(drag.t==='move'){ drag.moved=true; drag.it.x=snapv(wx-drag.ox); drag.it.y=snapv(wy-drag.oy); render(); return; }
  if(drag.t==='movez'){ drag.z.x=snapv(wx-drag.ox); drag.z.y=snapv(wy-drag.oy); render(); return; }
  if(drag.t==='rot'){ let a=Math.atan2(wy-drag.it.y,wx-drag.it.x)*180/Math.PI+90; if($('snap').checked) a=Math.round(a/5)*5; a=((a%360)+360)%360; drag.it.a=Math.round(a*10)/10; render(); return; }
  if(drag.t==='draw'){ S.draw.x1=snapv(wx); S.draw.y1=snapv(wy); render(); return; }
});
function endDrag(e){ ptrs.delete(e.pointerId); if(!drag) return;
  if(drag.t==='pan'&&!drag.moved){ S.sel=null; }
  if(drag.t==='draw'){ const d=S.draw; const w=Math.abs(d.x1-d.x0), h=Math.abs(d.y1-d.y0); if(w>20&&h>20){ const z={id:S.nextId++,x:Math.min(d.x0,d.x1),y:Math.min(d.y0,d.y1),w,h,name:'無塵室 '+(S.zones.length+1),cls:''}; S.zones.push(z); S.sel={t:'zone',id:z.id}; } S.draw=null; }
  if(drag.t==='pinch'&&ptrs.size>0){ drag=null; return; }
  drag=null; svg.classList.remove('panning'); render(); }
svg.addEventListener('pointerup',endDrag); svg.addEventListener('pointercancel',endDrag);
function pinchDist(){ const [a,b]=[...ptrs.values()]; return Math.hypot(a[0]-b[0],a[1]-b[1]); } function pinchCenter(){ const [a,b]=[...ptrs.values()]; return [(a[0]+b[0])/2,(a[1]+b[1])/2]; }
function finishPts(){ const [p,q]=S.pts; const dcm=Math.hypot(q[0]-p[0],q[1]-p[1]);
  if(S.tool==='calib'){ S.measure=[p,q]; S.pts=[]; ask(`這兩點實際距離是幾公分？（圖面目前換算 ${fmt(dcm,0)} cm）`, Math.round(dcm), v=>{ const real=parseFloat(v); if(real>0){ const pxDist=dcm/S.cmPerPx; S.cmPerPx=real/pxDist; toast(`比例已校正：${fmt(S.cmPerPx,4)} cm/px`); } S.measure=null; render(); }); }
  else { S.measure=[p,q]; S.pts=[]; } }

/* ---------- tools & keys ---------- */
function setTool(t){ S.tool=t; S.pts=[]; S.measure=null; S.draw=null; for(const k of ['select','zone','measure','calib']) $('t-'+k).classList.toggle('on',k===t); svg.className.baseVal='tool-'+t;
  $('hint').textContent = {select:'拖曳機台移動 · R 旋轉 90° · Delete 刪除 · Ctrl+D 複製 · 滾輪縮放 · 拖曳空白處平移 · 粗邊＝操作面', zone:'在圖上拖曳畫出無塵室範圍（可多個）', measure:'點兩點量距離', calib:'點圖上已知距離的兩點，再輸入實際公分數'}[t]; render(); }
for(const k of ['select','zone','measure','calib']) $('t-'+k).onclick=()=>setTool(k);
document.addEventListener('keydown',e=>{ if(e.target.matches('input,textarea,select')) return; const it=selItem(); const k=e.key.toLowerCase();
  if(k==='r'&&it){ it.a=(it.a+90)%360; render(); } else if(k==='delete'||k==='backspace'){ removeSel(); } else if((e.ctrlKey||e.metaKey)&&k==='d'){ e.preventDefault(); dupSel(); }
  else if(k==='escape'){ S.sel=null; S.pts=[]; S.measure=null; setTool('select'); } else if(k==='s') setTool('select'); else if(k==='z') setTool('zone'); else if(k==='m') setTool('measure');
  else if(k==='0') fit(); else if(k==='+'||k==='=') $('zoomIn').click(); else if(k==='-') $('zoomOut').click();
  else if(e.key.startsWith('Arrow')&&it){ e.preventDefault(); const st=e.shiftKey?10:1; if(e.key==='ArrowLeft') it.x-=st; if(e.key==='ArrowRight') it.x+=st; if(e.key==='ArrowUp') it.y-=st; if(e.key==='ArrowDown') it.y+=st; render(); } });

/* ---------- panel events (delegated) ---------- */
document.querySelector('aside').addEventListener('click',e=>{
  const dl=e.target.closest('[data-del]'); if(dl){ const id=+dl.dataset.del; S.items=S.items.filter(i=>i.id!==id); if(S.sel&&S.sel.t==='item'&&S.sel.id===id) S.sel=null; render(); return; }
  const dz=e.target.closest('[data-delz]'); if(dz){ const id=+dz.dataset.delz; S.zones=S.zones.filter(z=>z.id!==id); if(S.sel&&S.sel.t==='zone'&&S.sel.id===id) S.sel=null; render(); return; }
  const b=e.target.closest('[data-add]'); if(b){ addItem(EQUIP.find(x=>x.key===b.dataset.add)); return; }
  const p=e.target.closest('[data-pick]'); if(p){ S.sel={t:'item',id:+p.dataset.pick}; centerOn(selItem()); render(); return; }
  const pz=e.target.closest('[data-pickz]'); if(pz){ S.sel={t:'zone',id:+pz.dataset.pickz}; render(); return; }
  if(e.target.id==='bRot'){ const it=selItem(); it.a=(it.a+90)%360; render(); } if(e.target.id==='bDup') dupSel(); if(e.target.id==='bDel'||e.target.id==='bDelZ') removeSel(); });
document.querySelector('aside').addEventListener('change',e=>{ const it=selItem(), z=selZone(); const v=parseFloat(e.target.value);
  if(it){ ({dName:()=>it.name=e.target.value, dW:()=>it.w=v, dD:()=>it.d=v, dX:()=>it.x=v, dY:()=>it.y=v, dA:()=>it.a=((v%360)+360)%360, dClr:()=>it.clr=Math.max(0,v), dCat:()=>it.cat=e.target.value})[e.target.id]?.(); }
  if(z){ ({zName:()=>z.name=e.target.value, zCls:()=>z.cls=e.target.value, zW:()=>z.w=v, zH:()=>z.h=v})[e.target.id]?.(); }
  if(e.target.id==='search'){ renderPanel(new Set()); return; } render(); });
$('search').addEventListener('input',()=>renderPanel(new Set()));
$('cAdd').onclick=()=>{ const n=$('cName').value.trim()||'物件', w=+$('cW').value, d=+$('cD').value; if(!(w>0&&d>0)){ toast('請輸入 W、D（mm）'); return; } addItem({key:'custom:'+n,name:n,short:n,cat:'custom',w,d}); };
function centerOn(it){ if(!it) return; const r=svg.getBoundingClientRect(); const [sx,sy]=toScreen(it.x,it.y); if(sx<0||sx>r.width||sy<0||sy>r.height){ S.tx=r.width/2-it.x*S.s; S.ty=r.height/2-it.y*S.s; } }
for(const id of ['snap','grid','showGrid','showClear','showLabels']) $(id).addEventListener('change',render);
$('reset').onclick=()=>ask('清空所有已放置的機台與區域？（輸入 yes 確認）','',v=>{ if(v==='yes'){ S.items=[]; S.zones=[]; S.sel=null; render(); } });
function ask(msg,def,cb){ $('askMsg').textContent=msg; $('askVal').value=def; $('askDlg').showModal(); $('askVal').focus(); $('askVal').select();
  $('askOk').onclick=()=>{ $('askDlg').close(); cb($('askVal').value); }; $('askCancel').onclick=()=>$('askDlg').close();
  $('askVal').onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); $('askOk').click(); } }; }

/* ---------- export / import ---------- */
function layoutText(){ const L=[`億光大樓 4F 無塵室機台配置　${new Date().toLocaleDateString('zh-TW')}`,`座標：機台中心，相對於平面圖左上角 (cm)；角度順時針；W=操作面寬`,``,`#\t名稱\tW×D (mm)\tx (cm)\ty (cm)\t角度\t維修間距 (cm)`];
  S.items.forEach((it,i)=>L.push(`${i+1}\t${it.full||it.name}\t${it.w}×${it.d}\t${Math.round(it.x)}\t${Math.round(it.y)}\t${it.a}\t${it.clr}`));
  if(S.zones.length){ L.push('',`區域\t名稱\tClass\tx (cm)\ty (cm)\tW×H (cm)\t面積 (m²)`); S.zones.forEach((z,i)=>L.push(`${i+1}\t${z.name}\t${z.cls||'-'}\t${Math.round(z.x)}\t${Math.round(z.y)}\t${Math.round(z.w)}×${Math.round(z.h)}\t${fmt(z.w*z.h/1e4,2)}`)); }
  L.push('',$('status').innerText.replace(/\n/g,'　')); return L.join('\n'); }
function layoutJson(){ return JSON.stringify({v:1,cmPerPx:S.cmPerPx,nextId:S.nextId,items:S.items,zones:S.zones},null,1); }
function loadJson(txt){ const o=JSON.parse(txt); if(!o||!Array.isArray(o.items)) throw 0; S.items=o.items; S.zones=o.zones||[]; S.nextId=o.nextId||(Math.max(0,...S.items.map(i=>i.id),...S.zones.map(z=>z.id))+1); if(o.cmPerPx) S.cmPerPx=o.cmPerPx; S.sel=null; render(); }
let dlgMode='text';
function showDlg(m){ dlgMode=m; $('tabText').classList.toggle('on',m==='text'); $('tabJson').classList.toggle('on',m==='json'); $('dlgText').value = m==='text'?layoutText():layoutJson(); $('loadBtn').hidden = m!=='json'; $('dlgHint').textContent = m==='json'?'貼上先前複製的 JSON 後按「載入」。版面也會自動存在這個瀏覽器。':'可直接貼到 Excel / 文件。'; if(!$('dlg').open) $('dlg').showModal(); }
$('export').onclick=()=>showDlg('text'); $('tabText').onclick=()=>showDlg('text'); $('tabJson').onclick=()=>showDlg('json'); $('dlgClose').onclick=()=>$('dlg').close();
$('copyBtn').onclick=async()=>{ try{ await navigator.clipboard.writeText($('dlgText').value); $('dlgHint').textContent='已複製。'; }catch(_){ $('dlgText').select(); $('dlgHint').textContent='請手動 Ctrl+C 複製。'; } };
$('loadBtn').onclick=()=>{ try{ loadJson($('dlgText').value); $('dlg').close(); toast('已載入版面'); }catch(_){ $('dlgHint').textContent='JSON 格式不正確。'; } };
function save(){ try{ localStorage.setItem(STORE,layoutJson()); }catch(_){} }
function restore(){ try{ const t=localStorage.getItem(STORE); if(t){ const o=JSON.parse(t); S.items=o.items||[]; S.zones=o.zones||[]; S.nextId=o.nextId||1; if(o.cmPerPx) S.cmPerPx=o.cmPerPx; } }catch(_){} }
let toastT; function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2500); }

/* ---------- init ---------- */
$('planImg').setAttribute('href',PLAN.src); restore(); fit(); window.addEventListener('resize',()=>render()); if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>fit());
</script>
</body>
